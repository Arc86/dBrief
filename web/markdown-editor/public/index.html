<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; font-src 'self' file:; img-src 'self' file: data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @font-face { font-family: "dBrief Inter"; src: url("../Fonts/Inter-Regular.otf"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "dBrief Inter"; src: url("../Fonts/Inter-Bold.otf"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "dBrief Inter"; src: url("../Fonts/Inter-Italic.otf"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "dBrief Lato"; src: url("../Fonts/Lato-Regular.ttf"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "dBrief Lato"; src: url("../Fonts/Lato-Bold.ttf"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "dBrief Lato"; src: url("../Fonts/Lato-Italic.ttf"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "dBrief Lato"; src: url("../Fonts/Lato-BoldItalic.ttf"); font-weight: 700; font-style: italic; }
      @font-face { font-family: "dBrief Open Sans"; src: url("../Fonts/OpenSans-Variable.ttf"); font-weight: 300 800; font-style: normal; }
      @font-face { font-family: "dBrief Open Sans"; src: url("../Fonts/OpenSans-Italic-Variable.ttf"); font-weight: 300 800; font-style: italic; }
      @font-face { font-family: "dBrief Roboto"; src: url("../Fonts/Roboto-Variable.ttf"); font-weight: 100 900; font-style: normal; }
      @font-face { font-family: "dBrief Roboto"; src: url("../Fonts/Roboto-Italic-Variable.ttf"); font-weight: 100 900; font-style: italic; }
      @font-face { font-family: "dBrief EB Garamond"; src: url("../Fonts/EBGaramond-Variable.ttf"); font-weight: 400 800; font-style: normal; }
      @font-face { font-family: "dBrief EB Garamond"; src: url("../Fonts/EBGaramond-Italic-Variable.ttf"); font-weight: 400 800; font-style: italic; }
      @font-face { font-family: "dBrief OpenDyslexic"; src: url("../Fonts/OpenDyslexic-Regular.otf"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "dBrief OpenDyslexic"; src: url("../Fonts/OpenDyslexic-Bold.otf"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "dBrief OpenDyslexic"; src: url("../Fonts/OpenDyslexic-Italic.otf"); font-weight: 400; font-style: italic; }
    </style>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div id="editor"></div>
    <script src="editor.js"></script>
  </body>
</html>
