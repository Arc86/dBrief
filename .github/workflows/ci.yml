name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localization:
    name: Localization
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test the localization tooling
        run: python3 scripts/test_strings_check.py

      - name: Check strings are in sync
        # Fails when a UI string isn't in the catalog, a translation breaks its
        # placeholders, or the compiled translations weren't regenerated.
        run: make strings-check

      - name: Report translation coverage
        if: always()
        run: |
          {
            echo "### Translations"
            make -s strings-report
          } >> "$GITHUB_STEP_SUMMARY"

  test-and-package-beta:
    name: Test and package beta
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show build environment
        id: env
        run: |
          swift --version
          uname -a
          test "$(uname -m)" = "arm64"
          echo "swift=$(swift --version 2>&1 | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Dependencies (MLX, WhisperKit, FluidAudio…) dominate a cold build. The cache is
      # saved only from main, after the tests and before the beta build, so it holds the
      # debug build alone; pull requests restore main's copy.
      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.swift }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.swift }}-

      - name: Check summary editor bundle
        working-directory: web/markdown-editor
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code -- ../../Sources/dBrief/Resources/MarkdownEditor
          test -z "$(git status --porcelain -- ../../Sources/dBrief/Resources/MarkdownEditor)"

      - name: Run test suite
        run: |
          python3 scripts/test_beta_build.py
          python3 scripts/test_ticktick_credentials.py
          swift test

      - name: Save build cache
        if: github.event_name == 'push' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      # The beta package is built and uploaded from main (and manual runs), not on
      # every pull request push.
      - name: Assemble beta app
        if: github.event_name != 'pull_request'
        run: make beta CODESIGN_IDENTITY=-

      - name: Verify beta bundle
        if: github.event_name != 'pull_request'
        run: |
          test -d dBrief-Beta.app
          test ! -e dBrief.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dBrief-Beta.app/Contents/Info.plist)" = "com.dbrief.app.beta"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dBrief-Beta.app/Contents/Info.plist)" = "$(cat packaging/beta-build-number)"
          if /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' dBrief-Beta.app/Contents/Info.plist >/dev/null 2>&1; then
            echo "Beta bundle must not contain the production Sparkle feed URL." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 dBrief-Beta.app

      - name: Archive beta bundle
        if: github.event_name != 'pull_request'
        run: ditto -c -k --sequesterRsrc --keepParent dBrief-Beta.app dBrief-Beta.zip

      - name: Upload beta bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: dBrief-Beta-${{ github.sha }}
          path: dBrief-Beta.zip
          if-no-files-found: error
          retention-days: 14
