name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package-beta:
    name: Test and package beta
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # These suites await async work against wall-clock deadlines. Run alongside
      # the full suite on the 3-core runner, blocking disk I/O in other tests
      # saturates the cooperative pool and starves them past their deadlines, so
      # they get a separate, near-idle pass of their own.
      TIMING_SENSITIVE: "\\.(CaptureCoordinatorTests|FFmpegProcessRunnerTests|LibraryIndexTests|LibraryModelSmartViewTests|LibrarySmartFactsTests|LocalCLIServiceTests|PrivacyHTTPTraceTests|ReprocessingManagerTests|TranscribeRetryTests|TranscriptChatCancellationTests)\\b"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show build environment
        run: |
          swift --version
          uname -a
          test "$(uname -m)" = "arm64"

      - name: Run test suite
        run: |
          python3 scripts/test_beta_build.py
          swift test --skip "$TIMING_SENSITIVE"

      - name: Run timing-sensitive tests
        run: |
          swift build --build-tests
          # TEMP diagnostic: capture where the test process sits during the stall.
          ( sleep 45; for pid in $(pgrep -f 'dBriefPackageTests|swiftpm-testing-helper'); do
              echo "=== sample $pid: $(ps -o command= -p $pid | cut -c1-120)"
              sample "$pid" 5 -mayDie 2>&1 | grep -vE '^\s*$' | head -400
            done ) &
          swift test --skip-build --filter "$TIMING_SENSITIVE"

      - name: Assemble beta app
        run: make beta CODESIGN_IDENTITY=-

      - name: Verify beta bundle
        run: |
          test -d dBrief-Beta.app
          test ! -e dBrief.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dBrief-Beta.app/Contents/Info.plist)" = "com.dbrief.app.beta"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dBrief-Beta.app/Contents/Info.plist)" = "$(cat packaging/beta-build-number)"
          if /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' dBrief-Beta.app/Contents/Info.plist >/dev/null 2>&1; then
            echo "Beta bundle must not contain the production Sparkle feed URL." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 dBrief-Beta.app

      - name: Archive beta bundle
        run: ditto -c -k --sequesterRsrc --keepParent dBrief-Beta.app dBrief-Beta.zip

      - name: Upload beta bundle
        uses: actions/upload-artifact@v7
        with:
          name: dBrief-Beta-${{ github.sha }}
          path: dBrief-Beta.zip
          if-no-files-found: error
          retention-days: 14
